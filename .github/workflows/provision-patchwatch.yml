name: Provision patchwatch
# Zero-touch setup/refresh of the droplet auto-patcher. Everything from the repo.
# Secrets live ONLY as encrypted GitHub Actions secrets (never in the code).
on:
  workflow_dispatch:
    inputs:
      first_reboot_mode:
        description: "Reboot policy for THIS provisioning run"
        type: choice
        default: notify
        options: [notify, auto]
      final_reboot_mode:
        description: "Reboot policy to leave in place afterwards"
        type: choice
        default: auto
        options: [notify, auto]

# Own lane — never queue behind the bot-deploy pipeline; no manual approval gate
# (idempotent infra setup, first run uses reboot=notify so it's safe unattended).
concurrency:
  group: patchwatch-provision
  cancel-in-progress: true

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet boto3
      - name: Install SSH deploy key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # PROVE THE SECRET IS A KEY, here, before six steps of anonymous failures. On
          # 2026-10-14 every deploy died at the first ssh with "error in libcrypto" and the next
          # step concluded the DROPLET was missing docker. ssh-keygen -y writes the PUBLIC half,
          # discarded, so no key material can reach this log.
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "::error::DROPLET_SSH_KEY is not a usable OpenSSH private key. OpenSSH itself"
            echo "::error::cannot derive its public half ('error in libcrypto'). Common causes: a"
            echo "::error::PuTTY .ppk, the .pub half, a passphrase-protected key, or a missing"
            echo "::error::trailing newline. Fix it from a key PROVEN to work against the droplet:"
            echo "::error::    python ship.py --fix-ci-key"
            exit 1
          fi
          ssh-keyscan -H "${{ vars.DROPLET_HOST || '64.225.108.200' }}" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Provision patchwatch
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          DROPLET_HOST: ${{ vars.DROPLET_HOST || '64.225.108.200' }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          SSH_KEY: /home/runner/.ssh/deploy_key
          SPACES_KEY: ${{ secrets.SPACES_KEY }}
          SPACES_SECRET: ${{ secrets.SPACES_SECRET }}
          SPACES_REGION: ${{ vars.SPACES_REGION || 'fra1' }}
          SPACES_BUCKET: ${{ vars.SPACES_BUCKET || 'colt-backups' }}
          PATCH_TG_CHAT: ${{ secrets.PATCH_TG_CHAT }}
        run: |
          python patchwatch/provision_patchwatch.py \
            --first-reboot-mode "${{ github.event.inputs.first_reboot_mode }}" \
            --final-reboot-mode "${{ github.event.inputs.final_reboot_mode }}"
