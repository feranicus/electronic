name: Security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # weekly, catches new CVEs even without a push

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TRIVY IS A SUPPLY-CHAIN DEPENDENCY LIKE ANY OTHER, AND IT HAS BEEN COMPROMISED ONCE.
      # Aqua's Trivy was hit in Feb/Mar 2026: a malicious v0.69.4 went to GHCR, ECR Public and
      # Docker Hub, and 76 of 77 trivy-action tags were force-pushed to an infostealer that
      # scraped Runner.Worker process memory for every secret in the job. LiteLLM was then
      # compromised precisely BECAUSE its CI installed the poisoned Trivy automatically, which
      # is how one unrevoked token reached 2,500+ organisations.
      # We were never exposed (this repo's first commit is 2026-07-09, after the window, and we
      # never used trivy-action or setup-trivy). But the SHAPE of the risk was live here:
      # `curl .../main/contrib/install.sh | sh` fetches an installer from a MOVING BRANCH and
      # takes whatever the latest release happens to be, in a job that holds the droplet key.
      # So: pinned version, pinned installer commit, and the binary's checksum verified against
      # the signed checksums file BEFORE it is ever executed.
      - name: Install Trivy (pinned + checksum-verified)
        env:
          TRIVY_VERSION: "0.69.3"        # last release confirmed clean by Aqua's advisory
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          BASE="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -sfLO "$BASE/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sfLO "$BASE/trivy_${TRIVY_VERSION}_checksums.txt"
          # verify BEFORE unpacking or running anything
          grep " trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz$" "trivy_${TRIVY_VERSION}_checksums.txt" \
            | sha256sum -c -
          tar xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          trivy --version

      - name: Trivy - dependencies & secrets (filesystem, report-only)
        run: |
          trivy fs --scanners vuln,secret --severity HIGH --ignore-unfixed --exit-code 0 .
          trivy fs --scanners vuln,secret --severity CRITICAL --ignore-unfixed --exit-code 1 --ignorefile .trivyignore .

      - name: Trivy - IaC misconfig (Dockerfiles, compose; report-only)
        run: trivy config --severity HIGH,CRITICAL --exit-code 0 .

      - name: Hadolint - Dockerfile lint
        uses: hadolint/hadolint-action@v3.4.0
        with:
          recursive: true
          failure-threshold: error

      - name: pip-audit - Python advisories
        run: pip install pip-audit && pip-audit -r requirements.txt || true
