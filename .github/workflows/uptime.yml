# EXTERNAL uptime monitoring — deliberately NOT on the droplet.
#
# 2026-08-07: every domain on the host was refused for ~6 hours and nothing told the operator; he
# found it himself. The box's own observability (Grafana, Loki, the alerting in colt-web) all runs
# ON the box, behind the same reverse proxy that died — so when it matters most, it is mute.
# Monitoring that shares a failure domain with its subject is not monitoring.
#
# GitHub Actions is free, off-box, and already holds the deploy credentials, so it is the natural
# place. A failed run also emails the repo owner without any secret being configured at all.
name: uptime

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe every public endpoint
        id: probe
        shell: bash
        run: |
          set +e
          # host|url|expected-regex.  cybergod.ai/api/me answering 401 is HEALTHY: it proves the
          # backend is reachable AND that auth is enforced. Probing only "/" would go green on a
          # cached shell served by the PWA service worker.
          # Announce a browser. colt-web serves an unrecognised user agent a 404 on every PAGE
          # route (scanners get nothing), so a bare curl cannot see the site at all. This is
          # first-party monitoring of our own site; check_bot_gate.py is what tests the gate.
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36 cybergod-monitor/1.0"
          TARGETS=(
            "cybergod.ai|https://cybergod.ai/api/me|^(401)$"
            "www.cybergod.ai|https://www.cybergod.ai/|^(200|301|302|308)$"
            "cybergod.ai/|https://cybergod.ai/|^(200)$"
            "godeyes.ai|https://godeyes.ai/|^(200|301|302|308)$"
            "jobhuntwow.com|https://jobhuntwow.com/|^(200|301|302|308)$"
            "www.jobhuntwow.com|https://www.jobhuntwow.com/|^(200|301|302|308)$"
            "klimaanlage-preise.de|https://klimaanlage-preise.de/|^(200|301|302|308)$"
            # s4biz.io is NOT probed here. It owns its own repository and its own
            # .github/workflows/uptime.yml, which is the single source of truth for that site.
            # Duplicating the targets would give two homes for one list, and the second copy is
            # always the one that goes stale.
            #
            # What DOES stay here is the shared-proxy concern: s4biz.io is on the caddyguard vhost
            # roster and in its certificate loop, because a missing vhost or a lapsed certificate
            # on that proxy takes every domain on the box down together, and caddyguard owns the
            # proxy.
          )
          FAIL=""
          for t in "${TARGETS[@]}"; do
            IFS='|' read -r name url want <<< "$t"
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --retry 2 --retry-delay 5 \
                     -A "$UA" "$url")
            if [[ "$code" =~ $want ]]; then
              echo "OK    $name  -> $code"
            else
              echo "FAIL  $name  -> $code (expected $want)"
              FAIL="$FAIL\n• $name -> HTTP $code (expected $want)"
            fi
          done
          # CERTIFICATE EXPIRY. Distinct from reachability and it is the failure that arrives on
          # a schedule: one lapsed certificate takes EVERY domain on the shared proxy down at the
          # same instant. Caddy renews at 30 days, so under 10 means renewal has been failing for
          # ~3 weeks and nobody noticed. Checked from OUTSIDE, because the box's own monitoring
          # sits behind the proxy it is monitoring.
          for host in cybergod.ai godeyes.ai jobhuntwow.com klimaanlage-preise.de; do
            end=$(echo | timeout 20 openssl s_client -connect "$host:443" -servername "$host" 2>/dev/null \
                  | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
            if [ -z "$end" ]; then
              echo "FAIL  $host  -> no certificate presented"
              FAIL="$FAIL\n• $host -> no TLS certificate presented"
              continue
            fi
            left=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
            if [ "$left" -lt 10 ]; then
              echo "FAIL  $host  -> certificate expires in ${left}d"
              FAIL="$FAIL\n• $host -> TLS certificate expires in ${left} days (renewal is failing)"
            else
              echo "OK    $host  -> certificate ${left}d left"
            fi
          done

          if [ -n "$FAIL" ]; then
            {
              echo "failed<<EOF"
              echo -e "$FAIL"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Alert Telegram
        # Runs only when the probe failed. Secrets are optional: without them the job still fails
        # and GitHub emails the owner, so the alert path degrades instead of disappearing.
        if: failure()
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.PATCH_TG_CHAT }}
        shell: bash
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "no telegram secrets configured — the failed run itself is the alert"; exit 0
          fi
          MSG=$(printf 'UPTIME: an endpoint is down\n%b\n\nAll sites share ONE reverse proxy on the droplet, so several failing together usually means the proxy, not an app.\nRun: python recover.py --fix-caddy\n\n%s' \
                "${{ steps.probe.outputs.failed }}" \
                "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
               --data-urlencode "chat_id=${TG_CHAT}" \
               --data-urlencode "text=${MSG}" \
               --data-urlencode "disable_web_page_preview=true" >/dev/null
