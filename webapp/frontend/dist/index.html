<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- SEO. The stale search result had TWO causes, and these tags were only the second of them:
       BOT_404=1 served Googlebot a 404, so Google could never re-crawl, and kept showing a snippet
       harvested from the old GitHub Pages landing. Both are fixed together — correcting the tags
       without letting the crawler in would have changed nothing at all. See visitors.py. -->
  <title>Cybergod.ai — AI cyber-risk assessments for Sales &amp; Pre-Sales | S4Biz Group</title>
  <meta name="description" content="Cybergod.ai turns one company name into a board-ready external cyber-risk assessment: four decks, an animated report and a priced business case, in 6 languages. Built for Sales and Pre-Sales teams. By Cybergod LLC, S4Biz Group." />
  <link rel="canonical" href="https://cybergod.ai/" />
  <meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large" />
  <meta name="author" content="Cybergod LLC · S4Biz Group" />

  <!-- Open Graph / Twitter: this is what LinkedIn, WhatsApp, Slack and X render when the link is
       shared, and it is a separate surface from the Google snippet. Both must say the same thing. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Cybergod.ai" />
  <meta property="og:title" content="Cybergod.ai — AI cyber-risk assessments for Sales &amp; Pre-Sales" />
  <meta property="og:description" content="One company name in. Four board-ready decks, an animated report and a priced business case out — in about two minutes, in 6 languages." />
  <meta property="og:url" content="https://cybergod.ai/" />
  <meta property="og:image" content="https://cybergod.ai/og-cover.png" />
  <meta property="og:locale" content="en" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Cybergod.ai — AI cyber-risk assessments for Sales &amp; Pre-Sales" />
  <meta name="twitter:description" content="One company name in. Four board-ready decks, an animated report and a priced business case out." />
  <meta name="twitter:image" content="https://cybergod.ai/og-cover.png" />

  <!-- Structured data. This is what earns the rich result (name, logo, sitelinks) instead of a bare
       blue link, and it is the single highest-leverage SEO item on a single-page app. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://cybergod.ai/#org",
        "name": "Cybergod LLC",
        "alternateName": ["Cybergod.ai", "S4Biz Group"],
        "url": "https://cybergod.ai/",
        "logo": "https://cybergod.ai/icon.svg",
        "parentOrganization": { "@type": "Organization", "name": "S4Biz Group" },
        "contactPoint": [{
          "@type": "ContactPoint",
          "contactType": "sales",
          "email": "feranicus@s4biz.io",
          "availableLanguage": ["en", "de", "it", "fr", "es", "pl"]
        }]
      },
      {
        "@type": "WebSite",
        "@id": "https://cybergod.ai/#site",
        "url": "https://cybergod.ai/",
        "name": "Cybergod.ai",
        "publisher": { "@id": "https://cybergod.ai/#org" },
        "inLanguage": ["en", "de", "it", "fr", "es", "pl"]
      },
      {
        "@type": "SoftwareApplication",
        "name": "Cybergod.ai",
        "applicationCategory": "SecurityApplication",
        "operatingSystem": "Web",
        "url": "https://cybergod.ai/",
        "publisher": { "@id": "https://cybergod.ai/#org" },
        "description": "External cyber-risk assessment platform for Sales and Pre-Sales teams. Enter a company name and receive four board-ready decks, an animated report and a quantified business case, with zero packets sent to the target.",
        "featureList": [
          "Passive external attack-surface assessment",
          "Quantified business impact (FAIR-based loss exceedance)",
          "Geopolitical threat-actor profiling",
          "EU compliance assessment: NIS2, Cyber Resilience Act, EU AI Act",
          "Six interface languages, three document languages"
        ]
      }
    ]
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- PWA: installable on Android (Chrome install prompt) and iOS (Share -> Add to Home Screen) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The colour Android paints the status bar, and the browser paints its chrome. It was still
         #0C544E, the previous brand's dark teal, which is why the very top of the installed app
         stayed dark after the site went light. It now matches the top bar's gradient start. -->
    <meta name="theme-color" content="#4F46E5" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- iOS ignores the manifest icons: it needs apple-touch-icon (PNG, no transparency) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent shows the page through the status bar AND forces white status text,
         which is invisible over a light surface. "default" is dark text on the system bar. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="cybergod" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
